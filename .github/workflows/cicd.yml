name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - '.dvc/config'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs so training uploads and VM restarts cannot overlap.
concurrency:
  group: income-model-deployment
  cancel-in-progress: false

jobs:
  # JOB 1: Test using synthetic data, without cloud credentials.
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  # JOB 2: Pull versioned data, train, and publish a qualifying model.
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          from pathlib import Path

          raw_credentials = os.environ.get("STORAGE_CREDENTIALS", "")
          if not raw_credentials.strip():
              raise SystemExit("STORAGE_CREDENTIALS secret is missing or empty.")
          try:
              credentials = json.loads(raw_credentials)
          except json.JSONDecodeError:
              raise SystemExit("STORAGE_CREDENTIALS must contain the complete service-account JSON key.") from None
          if not isinstance(credentials, dict) or credentials.get("type") != "service_account":
              raise SystemExit("STORAGE_CREDENTIALS must be a service-account JSON key.")
          from google.oauth2 import service_account
          try:
              service_account.Credentials.from_service_account_info(credentials)
          except (ValueError, KeyError):
              raise SystemExit("STORAGE_CREDENTIALS has missing fields or an invalid private key.") from None
          path = Path(os.environ["RUNNER_TEMP"]) / "sa-key.json"
          path.touch(mode=0o600)
          path.write_text(json.dumps(credentials))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GOOGLE_APPLICATION_CREDENTIALS={path}\n")
          PYEOF

      - name: Configure DVC credentials for this runner
        run: |
          DVC_REMOTE=$(dvc config core.remote)
          dvc remote modify --local "$DVC_REMOTE" credentialpath "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json
          import math
          import os

          with open("outputs/report.json") as f:
              f1 = float(json.load(f)["f1_score"])
          if not math.isfinite(f1) or not 0.0 <= f1 <= 1.0:
              raise SystemExit(f"Invalid f1_score: {f1}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"f1={f1}\n")
          PYEOF

      # Do not replace the current model when quality-gate will reject it.
      - name: Upload model to Cloud Storage
        if: ${{ fromJSON(steps.read_report.outputs.f1) >= 0.65 }}
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ["ARTIFACT_BUCKET"])
          bucket.blob("artifacts/current/model.joblib").upload_from_filename(
              "models/model.joblib"
          )
          print("Model uploaded to Cloud Storage.")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error

      - name: Remove temporary credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/sa-key.json"

  # JOB 3: F1 for the positive class must meet the lab's quality threshold.
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check quality gate
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import math
          import os

          f1 = float(os.environ["F1_SCORE"])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1.0:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} must be >= 0.65 and <= 1.0. Deployment cancelled.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Ready to deploy.")
          PYEOF

  # JOB 4: Restart the VM service to download and load the new model.
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 5 http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for income-api (attempt $attempt/12)..."
              sleep 5
            done
            echo "Health check failed after 12 attempts."
            exit 1
